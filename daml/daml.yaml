sdk-version: 3.4.11
# New package name (not an upgrade of rentyvest-faucet 0.1.0). Same-name bumps fail
# Canton SCU because CIP-0056 interfaces live in this package alongside templates.
name: rentyvest-devnet
version: 0.1.0
source: src
build-options:
  - -Wno-upgrade-interfaces
# For strict Canton Network ABI compatibility, add Splice CIP-0056 interface DARs
# under daml/dars/ and list them as data-dependencies (see CIP-0056 spec).
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
